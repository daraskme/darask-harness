# darask-harness bundle patch. `dsh plugin --profile web add <darask-harness>`
# applies this layer over @deepseek-ai/dsh-base + dsh-web-app; nothing here
# re-implements an upstream row. dsh-darask's own cordis.patch.yml is folded
# in below so the profile composes each plugin exactly once — do not add
# dsh-darask to the profile separately.

# Restate the permission table so Auto sits beside the shipped presets.
# A patch replaces the targeted row's whole config.
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      auto:
        sandbox: workspace-write
        approval: ask
        name: 自動
        description: ワークスペース内の編集・ビルド・テスト・依存導入・通常のシェル・ブラウザー操作は自動で実行し、破壊・公開・外部送信・システム変更・PC 画面操作だけ承認を求めます。
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# Default agent preset: presets/darask (published into $DSH_HOME/.agent-presets
# by the darask-harness row). Upstream `standard` stays selectable.
- id: agent-presets
  config:
    default: darask

- insert:
    - id: locale-ja
      name: '@fang2hou/dsh-locale-ja'
    - id: llm-grok
      name: dsh-grok-provider
    - id: llm-openai-codex
      name: dsh-codex-connect
      config:
        enableProxy: false
        enableSearch: false
        enableReserveFallback: false
        enableNativeCompaction: false
        enableImageTool: false
        enableImageGeneration: true
        enableAutoReview: false
    - id: dsh-bridge-gateway
      name: dsh-bridge-gateway
    - id: dsh-darask
      name: dsh-darask
    - id: darask-hashline
      name: '@darask/dsh-hashline'
    # grok-build 由来: .grok/.claude/.cursor rules ディレクトリ。AGENTS.md 系は上流
    # agent-instructions がそのまま担当し、ここでは glob 条件ルールの読み取り時注入だけ足す。
    - id: darask-rules
      name: '@darask/dsh-rules'
    # grok-build 由来: ステータスライン。tokenUsage / contextPressure / sessionStats を
    # 再計算せず参照し、モデル・ターン・料金だけを daraskStatus projection で持つ。
    # 利用者は $DSH_HOME/darask/status-line.json で type/command/items/pricing を上書きできる。
    - id: darask-status-line
      name: '@darask/dsh-status-line'
      config:
        type: builtin
        items: [model, context, cost, turn-timer]
    # grok-build 由来: Memory v2。完了ターンからツール無しの補助モデル呼び出しで観測を抽出し、
    # $DSH_HOME/darask/memory/{global,workspaces/<slug>-<hash>} に不変ファイル + SQLite FTS5 索引 +
    # MEMORY.md 目次として保存。memory_search / memory_get ツールと /memory コマンド、Dream 統合を提供。
    # セッション永続化・compaction は上流のまま。
    - id: darask-memory
      name: '@darask/dsh-memory'
    # grok-build 由来: Hunk tracker。上流ファイルツールの fs/write-intent・fs/edit-intent・tools/result を
    # 観測してエージェント編集をターン帰属で追跡し、外部編集はターン境界で再読込して区別する。
    # hunks_status / hunks_diff ツールと /hunks コマンド (accept・reject・forget)。
    # 状態は $DSH_HOME/darask/hunks/<session>.json。baseline: session | git-head。
    - id: darask-hunk-tracker
      name: '@darask/dsh-hunk-tracker'
    # grok-build 由来: Codebase graph。tree-sitter (WASM) の tags クエリで JS / TS / TSX / Python / Go / Rust の
    # 定義・参照をワークスペース単位に索引し、code_definitions / code_references / code_outline / code_symbols
    # ツールと /code-graph コマンド (status・reindex・languages・outline・find) を提供。ファイルは ctx.fs 経由で
    # 読み、エージェント編集は fs/write-intent・tools/result から増分再索引。LSP・grep は上流のまま。
    # 索引は $DSH_HOME/darask/code-graph/<workspace-hash>.json。文法 WASM は npm run build で取得。
    - id: darask-code-graph
      name: '@darask/dsh-code-graph'
    # grok-build 由来: monitor ツール。長時間スクリプトを上流 ctx.shell (bash / pwsh、sandbox 適用) で起動して
    # ctx.jobs に登録し、stdout の各行を <monitor-event> として所有エージェントへ配信 (実行中は inject、
    # 待機中は followup で起床)。トークンバケットで抑制・追い付き通知、30 秒継続過負荷で自動停止。
    # 一覧・出力・停止は上流 job_list / job_output / job_kill をそのまま使う。
    - id: darask-monitor
      name: '@darask/dsh-monitor'
    # grok-build xai-fast-worktree のライフサイクル部分: worktree_create / worktree_list / worktree_remove と
    # /worktree (list・create・remove・gc)。<repo>/.darask/worktrees/<name> に git worktree add で作成し
    # (.git/info/exclude 登録)、$DSH_HOME/darask/worktrees/registry.json で所有・基点・時刻を追跡。
    # dirty は force 無しで消さない。CoW / overlay / Btrfs は非対象。
    - id: darask-worktree
      name: '@darask/dsh-worktree'
    - id: darask-harness
      name: darask-harness
